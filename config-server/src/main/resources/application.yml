server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:https://github.com/your-org/microservices-config}
          search-paths: ${SPRING_CLOUD_CONFIG_SERVER_GIT_SEARCHPATHS:{application}}
          default-label: ${SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULTLABEL:main}
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}